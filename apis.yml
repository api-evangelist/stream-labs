aid: stream-labs
name: Stream Labs
description: >-
  Streamlabs is a live-streaming toolkit for content creators, providing alerts,
  donations/tips, loyalty points, media share, chat and stream widgets across
  Twitch, YouTube and other platforms. The Streamlabs API lets developers access
  a user's Streamlabs account and trigger custom alerts, read and create
  donations, manage loyalty points, control media-share playback, spin the wheel,
  empty the tip jar, roll credits, and open a real-time Socket API for live
  events. Access is authorized with OAuth 2.0 using granular per-feature scopes,
  and requests are made against the versioned REST base at streamlabs.com/api/v2.0.
  Streamlabs is backed by Battery Ventures and was acquired by Logitech in 2019.
